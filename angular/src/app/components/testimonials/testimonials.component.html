<section id="testimonials">
  <div class="container">
    <div class="section-header reveal" style="margin-bottom:4rem">
      <div class="label">{{ i18n.t()['testimonials.label'] }}</div>
      <h2 class="section-title" style="margin-top:0.75rem">{{ i18n.t()['testimonials.title'] }}</h2>
    </div>

    <div class="testimonials-grid">

      <div class="testimonial-card reveal">
        <div class="testimonial-quote">&ldquo;</div>
        <div class="testimonial-stars">
          <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
        </div>
        <p class="testimonial-text">{{ i18n.t()['t1.text'] }}</p>
        <div class="testimonial-author">
          <img class="author-avatar"
            src="https://ui-avatars.com/api/?name=Marcus+T&background=f59e0b&color=fff&size=80&bold=true&rounded=true"
            alt="Marcus T." />
          <div>
            <div class="author-name">Marcus T.</div>
            <div class="author-role">CEO, NovaPay</div>
          </div>
        </div>
      </div>

      <div class="testimonial-card reveal reveal-delay-1">
        <div class="testimonial-quote">&ldquo;</div>
        <div class="testimonial-stars">
          <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
        </div>
        <p class="testimonial-text">{{ i18n.t()['t2.text'] }}</p>
        <div class="testimonial-author">
          <img class="author-avatar"
            src="https://ui-avatars.com/api/?name=Sophia+R&background=f59e0b&color=fff&size=80&bold=true&rounded=true"
            alt="Sophia R." />
          <div>
            <div class="author-name">Sophia R.</div>
            <div class="author-role">CTO, Stackify</div>
          </div>
        </div>
      </div>

      <div class="testimonial-card reveal reveal-delay-2">
        <div class="testimonial-quote">&ldquo;</div>
        <div class="testimonial-stars">
          <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
        </div>
        <p class="testimonial-text">{{ i18n.t()['t3.text'] }}</p>
        <div class="testimonial-author">
          <img class="author-avatar"
            src="https://ui-avatars.com/api/?name=James+O&background=f59e0b&color=fff&size=80&bold=true&rounded=true"
            alt="James O." />
          <div>
            <div class="author-name">James O.</div>
            <div class="author-role">Founder, GrowthLab</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

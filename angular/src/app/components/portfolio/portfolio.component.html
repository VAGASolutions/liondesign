<section id="portfolio" class="bg-muted border-t border-border border-b">
  <div class="container">
    <div class="section-header mb-12 reveal">
      <div class="label">{{ i18n.t()['portfolio.label'] }}</div>
      <h2 class="section-title mt-3">{{ i18n.t()['portfolio.title'] }}</h2>
    </div>

    <div class="portfolio-grid reveal">

      <a class="portfolio-item" href="https://palyazatnavigator.vercel.app" target="_blank" rel="noopener">
        <img class="portfolio-thumb" src="img/navigo.png" alt="Pályázat Navigátor" loading="lazy" />
        <div class="portfolio-overlay">
          <div class="portfolio-tag">{{ i18n.t()['tag.web'] }}</div>
          <div class="portfolio-name">Pályázat Navigátor</div>
        </div>
      </a>

      <a class="portfolio-item" href="https://www.aeolab.eu" target="_blank" rel="noopener">
        <img class="portfolio-thumb" src="img/aeolab.eu.png" alt="AEO Lab" loading="lazy" />
        <div class="portfolio-overlay">
          <div class="portfolio-tag">{{ i18n.t()['tag.brand'] }}</div>
          <div class="portfolio-name">AEO Lab</div>
        </div>
      </a>

      <a class="portfolio-item" href="https://www.brevity.hu" target="_blank" rel="noopener">
        <img class="portfolio-thumb" src="img/brevity.png" alt="Brevity" loading="lazy" />
        <div class="portfolio-overlay">
          <div class="portfolio-tag">{{ i18n.t()['tag.seo'] }}</div>
          <div class="portfolio-name">Brevity</div>
        </div>
      </a>

      <a class="portfolio-item" href="https://aicommunitylab.com" target="_blank" rel="noopener">
        <img class="portfolio-thumb" src="img/aicommunitylab.png" alt="AI Community Lab" loading="lazy" />
        <div class="portfolio-overlay">
          <div class="portfolio-tag">{{ i18n.t()['tag.web'] }}</div>
          <div class="portfolio-name">AI Community Lab</div>
        </div>
      </a>

    </div>
  </div>
</section>

[build]
  base    = "angular"
  command = "npm run build"
  publish = "dist/liondesign/browser"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# SPA fallback — minden route-ot az index.html-re irányít
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

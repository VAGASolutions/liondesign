name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Check for leftover console.log / debugger
        run: |
          if grep -rn --include="*.ts" -E "console\.log\(|debugger;?" src/app; then
            echo "::error::Found console.log/debugger left in src/app — remove before merging."
            exit 1
          fi
